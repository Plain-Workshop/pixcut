[package]
name = "pixcut"
version = "0.2.2"
description = "Offline-first PixCut desktop editor"
authors = ["PixCut"]
edition = "2021"

[lib]
name = "pixcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
tempfile = "3"
sha2 = "0.11"
zip = { version = "4", default-features = false }
pixcut-project = { path = "../crates/project" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync"] }
getrandom = "0.3"
tokio-util = "0.7"

[lints]
workspace = true
