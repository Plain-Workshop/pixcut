[package]
name = "pixcut"
version = "0.1.0"
description = "Offline-first PixCut desktop editor"
authors = ["PixCut"]
edition = "2021"

[lib]
name = "pixcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.17"
base64 = "0.22"
tempfile = "3"
pixcut-project = { path = "../crates/project" }

