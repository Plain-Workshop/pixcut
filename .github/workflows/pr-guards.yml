name: pr-guards

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/pr-guards.mjs "origin/${{ github.base_ref }}"
