name: Release

# Tag pushes build signed, notarized installers, updater artifacts, and a draft
# GitHub Release. Manual runs are dry runs unless "Create a draft release" is
# checked, and dry runs are allowed to be unsigned so the pipeline can be
# exercised before certificates exist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (empty: tauri.conf.json)"
        type: string
        default: ""
      release:
        description: "Create a draft GitHub Release (requires signing secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Resolve version and mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(node desktop/scripts/version.mjs)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          release="false"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then release="true"; fi
          if [ "$INPUT_RELEASE" = "true" ]; then release="true"; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "Building PixCut $version (release: $release, ref: $GITHUB_REF)"

  verify:
    name: Verify before packaging
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> desktop/target
          key: release-verify
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check the release version
        working-directory: desktop
        run: node scripts/version.mjs check
      - name: Test the frontend
        working-directory: desktop
        run: npm test
      - name: Build the frontend
        working-directory: desktop
        run: npm run build
      - name: Test the project model
        working-directory: desktop
        run: cargo test -p pixcut-project

  macos:
    name: macOS ${{ matrix.label }}
    needs: [prepare, verify]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: aarch64, runner: macos-15, target: aarch64-apple-darwin }
          - { label: x64, runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> desktop/target
          key: release-macos-${{ matrix.label }}
      - name: Require signing secrets
        if: needs.prepare.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::macOS releases must be signed. Set APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD in the release environment."
            exit 1
          fi
          notary=""
          [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && notary="apple-id"
          [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_PATH" ] && notary="api-key"
          if [ -z "$notary" ]; then
            echo "::error::macOS releases must be notarized. Set either APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID or APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_PATH."
            exit 1
          fi
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Apply version
        working-directory: desktop
        run: node scripts/version.mjs set "${{ needs.prepare.outputs.version }}"
      - name: Build bundle
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --target "${{ matrix.target }}" --bundles app,dmg
      - name: Verify and stage
        working-directory: desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          app="$bundle/macos/PixCut.app"
          dmg="$(find "$bundle/dmg" -name '*.dmg' -print -quit)"
          test -d "$app"
          test -n "$dmg"
          if [ "$RELEASE" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$dmg" || {
              echo "::error::The disk image has no notarization ticket."
              exit 1
            }
          else
            echo "::warning::Dry run: skipping signature and notarization checks."
          fi
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          test -d "$mount/PixCut.app"
          hdiutil detach "$mount" >/dev/null
          mkdir -p dist/release
          cp "$bundle/macos/PixCut.app.tar.gz" "dist/release/PixCut-$VERSION-macos-$LABEL.app.tar.gz"
          cp "$bundle/macos/PixCut.app.tar.gz.sig" "dist/release/PixCut-$VERSION-macos-$LABEL.app.tar.gz.sig"
          cp "$dmg" "dist/release/PixCut-$VERSION-macos-$LABEL.dmg"
          shasum -a 256 dist/release/* | sed "s#dist/release/##"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.label }}
          path: desktop/dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [prepare, verify]
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> desktop/target
          key: release-windows-x64
      - name: Require signing secrets
        if: needs.prepare.outputs.release == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ] || [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Windows releases must be signed. Set WINDOWS_CERTIFICATE (base64 PFX) and WINDOWS_CERTIFICATE_PASSWORD."
            exit 1
          fi
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Apply version
        working-directory: desktop
        run: node scripts/version.mjs set "${{ needs.prepare.outputs.version }}"
      - name: Build bundle
        working-directory: desktop
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --bundles nsis,msi
      - name: Verify and stage
        working-directory: desktop
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw 'Missing NSIS or MSI installer.' }
          if ($env:RELEASE -eq 'true') {
            foreach ($file in @($setup.FullName, $msi.FullName)) {
              $sig = Get-AuthenticodeSignature $file
              if ($sig.Status -ne 'Valid') { throw "$file is not signed: $($sig.Status)" }
            }
          } else {
            Write-Host '::warning::Dry run: skipping Authenticode checks.'
          }
          New-Item -ItemType Directory -Force -Path 'dist/release' | Out-Null
          Copy-Item $setup.FullName "dist/release/PixCut-$env:VERSION-windows-x64-setup.exe"
          Copy-Item "$($setup.FullName).sig" "dist/release/PixCut-$env:VERSION-windows-x64-setup.exe.sig"
          Copy-Item $msi.FullName "dist/release/PixCut-$env:VERSION-windows-x64.msi"
          Compress-Archive -Path 'target/release/PixCut.exe' -DestinationPath "dist/release/PixCut-$env:VERSION-windows-x64-portable.zip" -Force
          Get-FileHash dist/release/* -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: desktop/dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: [prepare, verify]
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> desktop/target
          key: release-linux-x64
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libxdo-dev
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Apply version
        working-directory: desktop
        run: node scripts/version.mjs set "${{ needs.prepare.outputs.version }}"
      - name: Build bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --bundles appimage,deb
      - name: Verify and stage
        working-directory: desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          deb="$(find target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/PixCut$'
          chmod +x "$appimage"
          ( cd "$(mktemp -d)" && "$OLDPWD/$appimage" --appimage-extract >/dev/null && test -x squashfs-root/AppRun )
          mkdir -p dist/release
          cp "$appimage" "dist/release/PixCut-$VERSION-linux-x86_64.AppImage"
          cp "$appimage.sig" "dist/release/PixCut-$VERSION-linux-x86_64.AppImage.sig"
          cp "$deb" "dist/release/PixCut-$VERSION-linux-x86_64.deb"
          sha256sum dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: desktop/dist/release/*
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: [prepare, verify, macos, windows, linux]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble feed and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          notes="dist/notes.md"
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## PixCut $VERSION"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              git log --no-merges --pretty='- %s' "$previous..$TAG" | head -60
            else
              echo "First public build of PixCut Desktop."
            fi
            echo
            echo "### Install"
            echo "- macOS: drag PixCut.app to Applications."
            echo "- Windows: run the setup installer (NSIS supports in-app updates)."
            echo "- Linux: run the AppImage, or install the .deb."
            echo
            echo "MP4 export uses the FFmpeg already installed on your device."
          } > "$notes"
          checksums=()
          while IFS= read -r file; do checksums+=("$file"); done < <(
            find dist -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*portable.zip'
          )
          node desktop/scripts/assemble-release.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$notes" \
            --asset "darwin-aarch64=$(find dist/release-macos-aarch64 -name '*.app.tar.gz' -print -quit)" \
            --asset "darwin-x86_64=$(find dist/release-macos-x64 -name '*.app.tar.gz' -print -quit)" \
            --asset "windows-x86_64=$(find dist/release-windows-x64 -name '*-setup.exe' -print -quit)" \
            --asset "linux-x86_64=$(find dist/release-linux-x64 -name '*.AppImage' -print -quit)" \
            "${checksums[@]}" \
            --out dist/release
          cat dist/release/latest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/release/* \
            --draft \
            "${prerelease[@]}" \
            --title "PixCut $VERSION" \
            --notes-file dist/notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "Draft release $TAG created. Review the assets, then publish it."
