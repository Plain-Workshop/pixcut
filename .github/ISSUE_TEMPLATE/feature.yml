name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: The use case
      description: What are you trying to make? Concrete workflows are more useful than vote counts.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
